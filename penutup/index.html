<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Penutup — Untuk Pika</title>
  <meta name="description" content="Makasih udah baca. Dariku Alpinan, padamu Merantika.">
  <meta name="theme-color" content="#4D96FF">
  <meta property="og:title" content="Untuk Pika — Penutup">
  <meta property="og:description" content="Dariku Alpinan, padamu Merantika.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23FF6B9D'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">

  <header class="topbar">
    <a class="brand" href="/pembukaan" data-go>Untuk Pika</a>
    <nav class="steps" aria-label="Halaman">
      <a class="step" href="/pembukaan" data-go><b>1</b><span>Pembukaan</span></a>
      <a class="step" href="/ungkapan" data-go><b>2</b><span>Ungkapan</span></a>
      <a class="step on" href="/penutup" data-go><b>3</b><span>Penutup</span></a>
    </nav>
  </header>

  <main class="stage two">
    <div class="sticker hide-sm" style="background:var(--purple);top:6%;left:46%;rotate:6deg" aria-hidden="true">the end (?)</div>
    <div class="sticker hide-sm" style="background:var(--yellow);bottom:6%;right:4%;rotate:-7deg" aria-hidden="true">makasih ♥</div>

    <section>
      <span class="eyebrow">Halaman 3 dari 3</span>
      <h1 class="mega md">Makasih<br><span class="hl mint">udah baca.</span></h1>
      <p class="lead">kalo pun kamu risih ya<b>aku tetep di sini</b>.</p>

      <div class="card ask" style="margin-top:30px;max-width:640px">
        <h3>jadi gimana? mau chatan?</h3>
        <div class="actions">
          <button class="btn mint" type="button" data-answer="now">eum, boleh pi</button>
          <button class="btn white" type="button" data-answer="later">ngapain sih</button>
        </div>
        <p id="reply" class="reply" role="status"></p>
      </div>

      <a class="again" href="/pembukaan" data-go>↺ Baca dari awal</a>
    </section>

    <section class="label-wrap" aria-label="Label pengirim">
      <div class="label">
        <svg class="stamp" viewBox="0 0 120 120" aria-hidden="true">
          <defs><path id="ring" d="M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/></defs>
          <circle cx="60" cy="60" r="56" fill="#FFD93D" stroke="#111" stroke-width="4"/>
          <text font-family="Archivo Black, Arial Black, sans-serif" font-size="11" fill="#111" letter-spacing="1.6"><textPath href="#ring">beneran ini aku cape bikinnya</textPath></text>
          <text x="60" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#111">♥</text>
        </svg>
        <div class="row from">
          <small>Dariku</small>
          <div class="name">Alpinan</div>
        </div>
        <div class="row mid">↓</div>
        <div class="row to">
          <small>Padamu</small>
          <div class="name">Merantika</div>
        </div>
        <div class="row code">
          <span class="barcode"></span>
          <span>NO. 001</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="marquee" aria-hidden="true">
    <div class="marquee-track" data-items="Dariku Alpinan|Padamu Merantika|Terima kasih"></div>
  </footer>
</div>
<script src="/app.js"></script>
</body>
</html>
